# Inkdocs on nginx + PHP-FPM.
# Cached pages are served by nginx directly; PHP only runs on a cache miss.

server {
    listen 80;
    server_name docs.example.com;
    root /var/www/inkdocs/public;
    index index.php;
    charset utf-8;
    charset_types text/html text/plain text/css text/xml application/javascript application/json application/xml text/markdown;

    gzip on;
    gzip_types text/css application/javascript application/json text/markdown text/plain application/xml image/svg+xml;

    # Don't add a server-level "types { }" block: it replaces mime.types entirely,
    # and CSS/JS would then be served as application/octet-stream.

    # Fingerprinted assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # 1. real file  2. cached page  3. cached data file  4. PHP
        try_files $uri /cache$uri/index.html /cache$uri /index.php$is_args$args;
    }

    location = / {
        try_files /cache/index.html /index.php$is_args$args;
    }

    # The cache folder is internal: only reachable through try_files above.
    location ^~ /cache/ {
        internal;
        add_header Cache-Control "public, max-age=300";

        # Raw page Markdown (page.md); nginx's default mime.types has no .md entry.
        location ~ \.md$ {
            internal;
            types { }
            default_type text/markdown;
        }
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }
}
